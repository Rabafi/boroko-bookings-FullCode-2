name: Daily Supabase Backup

on:
  schedule:
    # 02:30 Africa/Gaborone (UTC+2). GitHub schedules use UTC.
    - cron: '30 0 * * *'
  workflow_dispatch:

concurrency:
  group: daily-supabase-backup
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BACKUP_R2_PREFIX: tsa-bonno/supabase/
      BACKUP_STORAGE_R2_PREFIX: tsa-bonno/supabase/storage/v1/
      BACKUP_RECOVERY_R2_PREFIX: tsa-bonno/supabase/whole-project/
      BACKUP_DAILY_RETENTION_DAYS: '14'
      BACKUP_WEEKLY_RETENTION_DAYS: '90'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Verify backup secrets
        env:
          SUPABASE_BACKUP_DB_URL: ${{ secrets.SUPABASE_BACKUP_DB_URL }}
          BACKUP_ENCRYPTION_PUBLIC_KEY_B64: ${{ secrets.BACKUP_ENCRYPTION_PUBLIC_KEY_B64 }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          required_secrets=(
            SUPABASE_BACKUP_DB_URL
            BACKUP_ENCRYPTION_PUBLIC_KEY_B64
            CLOUDFLARE_R2_ACCOUNT_ID
            CLOUDFLARE_R2_BUCKET
            CLOUDFLARE_R2_ACCESS_KEY_ID
            CLOUDFLARE_R2_SECRET_ACCESS_KEY
          )
          missing_secrets=()
          for secret_name in "${required_secrets[@]}"; do
            if [ -z "${!secret_name:-}" ]; then
              missing_secrets+=("${secret_name}")
            fi
          done
          if (( ${#missing_secrets[@]} > 0 )); then
            printf '::error::Missing required GitHub Actions secrets: %s\n' "$(IFS=', '; echo "${missing_secrets[*]}")"
            exit 1
          fi
          echo "All required database backup secrets are configured; the isolated Storage step validates its own S3 credentials."

      - name: Create authoritative Supabase SQL dumps
        id: dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_BACKUP_DB_URL }}
          BACKUP_PUBLIC_KEY_B64: ${{ secrets.BACKUP_ENCRYPTION_PUBLIC_KEY_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          stamp="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          backup_dir="${RUNNER_TEMP}/supabase-backup-${stamp}"
          archive_path="${RUNNER_TEMP}/tsa-bonno-supabase-${stamp}-${GITHUB_RUN_ID}.tar.gz"
          encrypted_path="${archive_path}.tbbackup"
          public_key_path="${RUNNER_TEMP}/backup-public.pem"
          mkdir -p "${backup_dir}"

          npx --yes supabase@2.96.0 db dump --db-url "${SUPABASE_DB_URL}" -f "${backup_dir}/roles.sql" --role-only
          npx --yes supabase@2.96.0 db dump --db-url "${SUPABASE_DB_URL}" -f "${backup_dir}/schema.sql"
          npx --yes supabase@2.96.0 db dump --db-url "${SUPABASE_DB_URL}" -f "${backup_dir}/data.sql" --use-copy --data-only -x "storage.buckets_vectors" -x "storage.vector_indexes"

          test -s "${backup_dir}/roles.sql"
          test -s "${backup_dir}/schema.sql"
          test -s "${backup_dir}/data.sql"

          jq -n \
            --arg created_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg commit "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            '{format_version: 1, created_at: $created_at, repository: $repository, commit: $commit, run_id: $run_id, contents: ["roles.sql", "schema.sql", "data.sql"]}' \
            > "${backup_dir}/metadata.json"
          (
            cd "${backup_dir}"
            sha256sum roles.sql schema.sql data.sql metadata.json > SHA256SUMS
          )
          tar -C "${backup_dir}" -czf "${archive_path}" .

          printf '%s' "${BACKUP_PUBLIC_KEY_B64}" | base64 --decode > "${public_key_path}"
          node scripts/backup-crypto.mjs encrypt \
            --input "${archive_path}" \
            --output "${encrypted_path}" \
            --public-key "${public_key_path}"
          test -s "${encrypted_path}"

          rm -rf "${backup_dir}" "${archive_path}" "${public_key_path}"
          echo "encrypted_path=${encrypted_path}" >> "${GITHUB_OUTPUT}"
          echo "encrypted_name=$(basename "${encrypted_path}")" >> "${GITHUB_OUTPUT}"

      - name: Retain encrypted GitHub recovery artifact
        id: artifact_upload
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.dump.outputs.encrypted_name }}
          path: ${{ steps.dump.outputs.encrypted_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload encrypted backup to Cloudflare R2
        id: r2_upload
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          BACKUP_R2_PREFIX: ${{ env.BACKUP_R2_PREFIX }}
          BACKUP_DAILY_RETENTION_DAYS: ${{ env.BACKUP_DAILY_RETENTION_DAYS }}
          BACKUP_WEEKLY_RETENTION_DAYS: ${{ env.BACKUP_WEEKLY_RETENTION_DAYS }}
        run: node scripts/r2-backup.mjs "${{ steps.dump.outputs.encrypted_path }}"

      - name: Back up and certify encrypted Supabase Storage
        id: storage_backup
        continue-on-error: true
        env:
          SUPABASE_STORAGE_S3_ENDPOINT: ${{ secrets.SUPABASE_STORAGE_S3_ENDPOINT }}
          SUPABASE_STORAGE_S3_REGION: ${{ secrets.SUPABASE_STORAGE_S3_REGION }}
          SUPABASE_STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_STORAGE_S3_ACCESS_KEY_ID }}
          SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY }}
          BACKUP_ENCRYPTION_PUBLIC_KEY_B64: ${{ secrets.BACKUP_ENCRYPTION_PUBLIC_KEY_B64 }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          BACKUP_STORAGE_R2_PREFIX: ${{ env.BACKUP_STORAGE_R2_PREFIX }}
          BACKUP_DAILY_RETENTION_DAYS: ${{ env.BACKUP_DAILY_RETENTION_DAYS }}
          BACKUP_WEEKLY_RETENTION_DAYS: ${{ env.BACKUP_WEEKLY_RETENTION_DAYS }}
        shell: bash
        run: |
          set -euo pipefail
          required_secrets=(
            SUPABASE_STORAGE_S3_ENDPOINT
            SUPABASE_STORAGE_S3_REGION
            SUPABASE_STORAGE_S3_ACCESS_KEY_ID
            SUPABASE_STORAGE_S3_SECRET_ACCESS_KEY
            BACKUP_ENCRYPTION_PUBLIC_KEY_B64
            CLOUDFLARE_R2_ACCOUNT_ID
            CLOUDFLARE_R2_BUCKET
            CLOUDFLARE_R2_ACCESS_KEY_ID
            CLOUDFLARE_R2_SECRET_ACCESS_KEY
          )
          missing_secrets=()
          for secret_name in "${required_secrets[@]}"; do
            if [ -z "${!secret_name:-}" ]; then
              missing_secrets+=("${secret_name}")
            fi
          done
          if (( ${#missing_secrets[@]} > 0 )); then
            printf '::error::Missing required Supabase Storage backup secrets: %s\n' "$(IFS=', '; echo "${missing_secrets[*]}")"
            exit 1
          fi
          node scripts/supabase-storage-backup.mjs

      - name: Build encrypted whole-project recovery bundle
        id: recovery_bundle
        env:
          SUPABASE_BACKUP_DB_URL: ${{ secrets.SUPABASE_BACKUP_DB_URL }}
          BACKUP_ENCRYPTION_PUBLIC_KEY_B64: ${{ secrets.BACKUP_ENCRYPTION_PUBLIC_KEY_B64 }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_RECOVERY_OUTPUT_DIR: ${{ runner.temp }}/supabase-whole-project-output
        shell: bash
        run: |
          set -euo pipefail
          node scripts/supabase-whole-project-recovery.mjs --output "${SUPABASE_RECOVERY_OUTPUT_DIR}"
          recovery_path="$(find "${SUPABASE_RECOVERY_OUTPUT_DIR}" -maxdepth 1 -type f -name '*.tbbackup' -print -quit)"
          test -n "${recovery_path}"
          test -s "${recovery_path}"
          echo "encrypted_path=${recovery_path}" >> "${GITHUB_OUTPUT}"
          echo "encrypted_name=$(basename "${recovery_path}")" >> "${GITHUB_OUTPUT}"

      - name: Retain encrypted whole-project recovery artifact
        id: recovery_artifact_upload
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.recovery_bundle.outputs.encrypted_name }}
          path: ${{ steps.recovery_bundle.outputs.encrypted_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload encrypted whole-project recovery bundle to Cloudflare R2
        id: recovery_r2_upload
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          BACKUP_R2_PREFIX: ${{ env.BACKUP_RECOVERY_R2_PREFIX }}
          BACKUP_DAILY_RETENTION_DAYS: ${{ env.BACKUP_DAILY_RETENTION_DAYS }}
          BACKUP_WEEKLY_RETENTION_DAYS: ${{ env.BACKUP_WEEKLY_RETENTION_DAYS }}
        run: node scripts/r2-backup.mjs "${{ steps.recovery_bundle.outputs.encrypted_path }}"

      - name: Enforce complete backup success
        id: backup_gate
        if: always()
        env:
          DATABASE_DUMP_OUTCOME: ${{ steps.dump.outcome }}
          DATABASE_ARTIFACT_OUTCOME: ${{ steps.artifact_upload.outcome }}
          DATABASE_R2_OUTCOME: ${{ steps.r2_upload.outcome }}
          STORAGE_BACKUP_OUTCOME: ${{ steps.storage_backup.outcome }}
          RECOVERY_BUNDLE_OUTCOME: ${{ steps.recovery_bundle.outcome }}
          RECOVERY_ARTIFACT_OUTCOME: ${{ steps.recovery_artifact_upload.outcome }}
          RECOVERY_R2_OUTCOME: ${{ steps.recovery_r2_upload.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          failures=()
          require_success() {
            local label="$1"
            local outcome="$2"
            if [ "${outcome}" != 'success' ]; then
              failures+=("${label}=${outcome:-not-run}")
            fi
          }

          require_success 'database-dump' "${DATABASE_DUMP_OUTCOME}"
          require_success 'database-github-artifact' "${DATABASE_ARTIFACT_OUTCOME}"
          require_success 'database-r2' "${DATABASE_R2_OUTCOME}"
          require_success 'storage-backup' "${STORAGE_BACKUP_OUTCOME}"
          require_success 'whole-project-bundle' "${RECOVERY_BUNDLE_OUTCOME}"
          require_success 'whole-project-github-artifact' "${RECOVERY_ARTIFACT_OUTCOME}"
          require_success 'whole-project-r2' "${RECOVERY_R2_OUTCOME}"

          if (( ${#failures[@]} > 0 )); then
            printf '::error::Supabase backup incomplete: %s\n' "$(IFS=', '; echo "${failures[*]}")"
            exit 1
          fi
          echo 'Database, Storage, and whole-project backup tranches completed successfully.'

      - name: Write backup failure summary
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Supabase backup failed'
            echo
            echo "The scheduled backup did not complete. No secret values are included in this summary."
            echo
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Trigger: ${GITHUB_EVENT_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo
            echo 'Inspect the failed step, then verify the latest encrypted database, Storage, and whole-project Cloudflare R2 copies before retrying.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Open or update backup failure issue
        if: failure()
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- tsa-bonno-supabase-backup-failure -->'
            const title = 'Supabase backup failed'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              marker,
              '## Supabase backup failed',
              '',
              `Run: [${context.runId}](${runUrl})`,
              `Trigger: ${context.eventName}`,
              `Commit: ${context.sha}`,
              '',
              'This issue is deduplicated by its marker. Review the run logs and confirm the latest encrypted database, Storage, and whole-project Cloudflare R2 copies before closing it.',
            ].join('\n')
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            const existing = openIssues.find((issue) => issue.title === title && issue.body?.includes(marker))
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              })
              core.notice(`Updated existing backup failure issue #${existing.number}.`)
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              })
              core.notice(`Opened backup failure issue #${created.data.number}.`)
            }

      - name: Check backup freshness and report overdue state
        if: always()
        continue-on-error: true
        env:
          BACKUP_SUCCEEDED: ${{ steps.backup_gate.outcome == 'success' }}
          BACKUP_MAX_AGE_HOURS: '26'
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- tsa-bonno-supabase-backup-overdue -->'
            const title = 'Supabase backup overdue'
            const failureMarker = '<!-- tsa-bonno-supabase-backup-failure -->'
            const failureTitle = 'Supabase backup failed'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            })
            const existing = openIssues.find((issue) => issue.title === title && issue.body?.includes(marker))
            const existingFailure = openIssues.find((issue) => issue.title === failureTitle && issue.body?.includes(failureMarker))
            const closeIssue = async (issue, alertType) => {
              if (!issue) return
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              })
              core.notice(`Closed recovered backup ${alertType} issue #${issue.number}.`)
            }

            if (process.env.BACKUP_SUCCEEDED === 'true') {
              await closeIssue(existing, 'overdue')
              await closeIssue(existingFailure, 'failure')
              core.notice('Backup completed; freshness is current.')
              return
            }

            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'supabase-backup.yml',
              event: 'schedule',
              status: 'completed',
              per_page: 20,
            })
            const previousSuccess = runs.workflow_runs.find((run) => run.id !== context.runId && run.conclusion === 'success')
            const lastSuccessAt = previousSuccess && Date.parse(previousSuccess.updated_at || previousSuccess.created_at)
            const maxAgeMs = Number(process.env.BACKUP_MAX_AGE_HOURS) * 60 * 60 * 1000
            const overdue = !lastSuccessAt || (Date.now() - lastSuccessAt) > maxAgeMs
            if (!overdue) {
              core.notice('A recent successful backup exists; overdue alert not required.')
              return
            }

            const body = [
              marker,
              '## Supabase backup overdue',
              '',
              `The latest scheduled backup is older than ${process.env.BACKUP_MAX_AGE_HOURS} hours or no successful scheduled backup exists.`,
              '',
              `Current run: [${context.runId}](${runUrl})`,
              previousSuccess ? `Last successful run: [${previousSuccess.id}](${previousSuccess.html_url})` : 'Last successful run: none found',
              '',
              'This issue is deduplicated by its marker. Inspect the workflow and verify the latest encrypted Cloudflare R2 copy.',
            ].join('\n')
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              })
              core.notice(`Updated existing backup overdue issue #${existing.number}.`)
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              })
              core.notice(`Opened backup overdue issue #${created.data.number}.`)
            }

      - name: Remove runner backup material
        if: always()
        shell: bash
        run: |
          rm -rf "${RUNNER_TEMP}"/supabase-backup-* \
            "${RUNNER_TEMP}"/supabase-storage-* \
            "${RUNNER_TEMP}"/supabase-whole-project-output \
            "${RUNNER_TEMP}"/supabase-whole-project-* \
            "${RUNNER_TEMP}"/tsa-bonno-whole-project-* \
            "${RUNNER_TEMP}"/tsa-bonno-supabase-* \
            "${RUNNER_TEMP}"/backup-public.pem
