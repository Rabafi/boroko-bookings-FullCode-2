[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://borokobookings.com; connect-src 'self' https://oicgpknsmtvcsjacymum.supabase.co; font-src 'self';"

[[redirects]]
  from = "/features"
  to = "/features.html"
  status = 200

