<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lead Management | Boroko Bookings CRM</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#18352b" />
    <link rel="icon" type="image/svg+xml" href="./assets/boroko-bookings-logo.svg" />
    <link rel="alternate icon" type="image/png" href="./assets/boroko-bookings-logo-light.png" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
      .crm-body { background: #f4efe7; min-height: 100vh; }
      .crm-shell { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
      .crm-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
      .crm-header h1 { margin: 0; font-size: 1.6rem; }
      .crm-user { display: flex; align-items: center; gap: 12px; color: var(--ink-soft); font-size: 0.9rem; }

      .crm-login { max-width: 400px; margin: 80px auto; text-align: center; }
      .crm-login .demo-form { text-align: left; }

      .crm-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
      .crm-stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; text-align: center; }
      .crm-stat strong { display: block; font-size: 1.8rem; color: var(--brand); }
      .crm-stat span { font-size: 0.82rem; color: var(--ink-soft); }

      .crm-filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
      .crm-filters select, .crm-filters input { padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 0.9rem; }

      .crm-table-wrap { overflow-x: auto; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
      .crm-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
      .crm-table th { text-align: left; padding: 14px 16px; background: rgba(23,76,58,0.06); font-weight: 800; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--brand); border-bottom: 1px solid var(--line); white-space: nowrap; }
      .crm-table td { padding: 12px 16px; border-bottom: 1px solid rgba(22,50,41,0.06); vertical-align: top; }
      .crm-table tr:last-child td { border-bottom: 0; }
      .crm-table tr:hover td { background: rgba(23,76,58,0.02); }

      .status-badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; }
      .status-new { background: #e8f0fe; color: #1a56db; }
      .status-contacted { background: #fef3c7; color: #b45309; }
      .status-qualified { background: #d1fae5; color: #065f46; }
      .status-converted { background: #ccfbf1; color: #134e4a; }
      .status-lost { background: #fce4ec; color: #b71c1c; }

      .crm-table select { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); font-size: 0.82rem; background: white; cursor: pointer; }
      .crm-table .notes-preview { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-soft); font-size: 0.82rem; }

      .crm-empty { text-align: center; padding: 60px 20px; color: var(--ink-soft); }

      .crm-export { margin-bottom: 16px; }

      .crm-loading { text-align: center; padding: 60px; color: var(--ink-soft); }

      #login-error { color: #cc4444; font-size: 0.88rem; margin-top: 8px; display: none; }
      #login-error.is-visible { display: block; }

      .crm-error { text-align: center; padding: 40px; color: #cc4444; }

      .crm-logout-btn { padding: 8px 16px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,0.8); cursor: pointer; font-weight: 700; font-size: 0.82rem; color: var(--ink-soft); }
      .crm-logout-btn:hover { background: rgba(255,255,255,0.96); color: #cc4444; }

      @media (max-width: 720px) {
        .crm-stats { grid-template-columns: repeat(2, 1fr); }
        .crm-table th, .crm-table td { padding: 10px 12px; }
      }
    </style>
  </head>
  <body class="crm-body">
    <div class="crm-shell" id="app">
      <div id="login-view" style="display:none;">
        <div class="crm-login">
          <img src="./assets/boroko-bookings-logo-light.png" alt="Boroko Bookings" style="width:140px;height:auto;margin-bottom:16px;" />
          <h1 style="font-size:1.4rem;margin-bottom:4px;">Lead Management</h1>
          <p style="color:var(--ink-soft);margin-bottom:24px;">Sign in to view enquiries</p>
          <form class="demo-form" id="login-form">
            <label>
              Email
              <input type="email" id="login-email" placeholder="admin@borokobookings.com" required />
            </label>
            <label>
              Password
              <div style="position:relative;">
                <input type="password" id="login-password" placeholder="Enter password" required style="padding-right:44px;" />
                <button type="button" id="toggle-password" tabindex="-1" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.1rem;color:var(--ink-soft);padding:4px;" title="Show password">👁</button>
              </div>
            </label>
            <div class="demo-actions">
              <button class="btn btn-primary" type="submit" style="width:100%;">Sign in</button>
            </div>
            <p id="login-error"></p>
          </form>
        </div>
      </div>

      <div id="dashboard-view" style="display:none;">
        <div class="crm-header">
          <div>
            <h1>Lead Management</h1>
            <p style="color:var(--ink-soft);margin:4px 0 0;font-size:0.88rem;">Marketing enquiries from the website</p>
          </div>
          <div class="crm-user">
            <span id="user-email"></span>
            <button class="crm-logout-btn" id="logout-btn">Sign out</button>
          </div>
        </div>

        <div class="crm-stats" id="stats-row">
          <div class="crm-stat"><strong id="stat-total">0</strong><span>Total leads</span></div>
          <div class="crm-stat"><strong id="stat-new">0</strong><span>New</span></div>
          <div class="crm-stat"><strong id="stat-contacted">0</strong><span>Contacted</span></div>
          <div class="crm-stat"><strong id="stat-converted">0</strong><span>Converted</span></div>
        </div>

        <div class="crm-filters">
          <select id="status-filter">
            <option value="">All statuses</option>
            <option value="new">New</option>
            <option value="contacted">Contacted</option>
            <option value="qualified">Qualified</option>
            <option value="converted">Converted</option>
            <option value="lost">Lost</option>
          </select>
          <input type="text" id="search-input" placeholder="Search name or lodge..." style="flex:1;min-width:180px;" />
        </div>

        <div class="crm-export">
          <button class="btn btn-secondary" id="export-btn" style="min-height:38px;padding:0 16px;font-size:0.85rem;">Export CSV</button>
          <span id="export-count" style="margin-left:12px;font-size:0.85rem;color:var(--ink-soft);"></span>
        </div>

        <div id="loading-state" class="crm-loading">Loading leads...</div>
        <div id="error-state" class="crm-error" style="display:none;"></div>

        <div class="crm-table-wrap" id="table-wrap" style="display:none;">
          <table class="crm-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Lodge</th>
                <th>Contact</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Interest</th>
                <th>Notes</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="leads-tbody"></tbody>
          </table>
        </div>

        <div id="empty-state" class="crm-empty" style="display:none;">
          <p style="font-size:1.2rem;font-weight:700;">No leads found</p>
          <p>Enquiries submitted through the website will appear here.</p>
        </div>
      </div>
    </div>

    <script>
    (function () {
      var SUPABASE_URL = 'https://oicgpknsmtvcsjacymum.supabase.co'
      var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pY2dwa25zbXR2Y3NqYWN5bXVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2OTM1MTEsImV4cCI6MjA4OTI2OTUxMX0.WbC5C1QaVeNaTbTG0_xdcsUlK3BoA8onWC607B_uGlY'
      var EDGE_FUNCTION_URL = 'https://oicgpknsmtvcsjacymum.supabase.co/functions/v1/auth-master-admin'
      var supabase = null
      var allLeads = []
      var currentUser = null

      var loginView = document.getElementById('login-view')
      var dashboardView = document.getElementById('dashboard-view')
      var loginForm = document.getElementById('login-form')
      var loginEmail = document.getElementById('login-email')
      var loginPassword = document.getElementById('login-password')
      var loginError = document.getElementById('login-error')
      var logoutBtn = document.getElementById('logout-btn')
      var userEmail = document.getElementById('user-email')
      var leadsTbody = document.getElementById('leads-tbody')
      var loadingState = document.getElementById('loading-state')
      var errorState = document.getElementById('error-state')
      var tableWrap = document.getElementById('table-wrap')
      var emptyState = document.getElementById('empty-state')
      var statusFilter = document.getElementById('status-filter')
      var searchInput = document.getElementById('search-input')
      var exportBtn = document.getElementById('export-btn')
      var exportCount = document.getElementById('export-count')
      var togglePasswordBtn = document.getElementById('toggle-password')
      var loginPasswordInput = document.getElementById('login-password')

      function initSupabase() {
        if (typeof supabaseClient !== 'undefined') {
          supabase = supabaseClient.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: true, storageKey: 'boroko-crm-auth' }
          })
        } else {
          supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: true, storageKey: 'boroko-crm-auth' }
          })
        }
      }

      function showView(view) {
        loginView.style.display = view === 'login' ? 'block' : 'none'
        dashboardView.style.display = view === 'dashboard' ? 'block' : 'none'
      }

      function formatDate(iso) {
        if (!iso) return '-'
        var d = new Date(iso)
        return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
      }

      function statusClass(status) {
        return 'status-' + (status || 'new')
      }

      function escapeHtml(str) {
        if (!str) return ''
        var d = document.createElement('div')
        d.textContent = str
        return d.innerHTML
      }

      function renderLeads(leads) {
        allLeads = leads
        var filtered = filterLeads(leads)
        leadsTbody.innerHTML = ''

        if (filtered.length === 0) {
          tableWrap.style.display = 'none'
          emptyState.style.display = 'block'
          exportCount.textContent = '0 leads'
          updateStats(leads)
          return
        }

        tableWrap.style.display = 'block'
        emptyState.style.display = 'none'
        exportCount.textContent = filtered.length + ' of ' + leads.length + ' leads'

        filtered.forEach(function (lead) {
          var tr = document.createElement('tr')
          tr.innerHTML =
            '<td style="white-space:nowrap;">' + formatDate(lead.created_at) + '</td>' +
            '<td><strong>' + escapeHtml(lead.lodge_name) + '</strong></td>' +
            '<td>' + escapeHtml(lead.contact_name) + '</td>' +
            '<td><a href="mailto:' + encodeURIComponent(lead.email) + '" style="color:var(--brand);">' + escapeHtml(lead.email) + '</a></td>' +
            '<td>' + (lead.phone ? escapeHtml(lead.phone) : '-') + '</td>' +
            '<td>' + (lead.interest ? escapeHtml(lead.interest) : '-') + '</td>' +
            '<td><div class="notes-preview" title="' + escapeHtml(lead.notes || '') + '">' + (lead.notes ? escapeHtml(lead.notes.substring(0, 60) + (lead.notes.length > 60 ? '...' : '')) : '-') + '</div></td>' +
            '<td><select class="status-select" data-id="' + lead.id + '">' +
              '<option value="new"' + (lead.status === 'new' ? ' selected' : '') + '>New</option>' +
              '<option value="contacted"' + (lead.status === 'contacted' ? ' selected' : '') + '>Contacted</option>' +
              '<option value="qualified"' + (lead.status === 'qualified' ? ' selected' : '') + '>Qualified</option>' +
              '<option value="converted"' + (lead.status === 'converted' ? ' selected' : '') + '>Converted</option>' +
              '<option value="lost"' + (lead.status === 'lost' ? ' selected' : '') + '>Lost</option>' +
            '</select></td>'
          leadsTbody.appendChild(tr)
        })

        document.querySelectorAll('.status-select').forEach(function (sel) {
          sel.addEventListener('change', function () {
            updateLeadStatus(this.getAttribute('data-id'), this.value)
          })
        })

        updateStats(leads)
      }

      function filterLeads(leads) {
        var status = statusFilter.value
        var search = searchInput.value.toLowerCase().trim()
        return leads.filter(function (l) {
          if (status && l.status !== status) return false
          if (search) {
            var haystack = (l.lodge_name + ' ' + l.contact_name + ' ' + l.email + ' ' + (l.notes || '')).toLowerCase()
            if (haystack.indexOf(search) === -1) return false
          }
          return true
        })
      }

      function updateStats(leads) {
        document.getElementById('stat-total').textContent = leads.length
        document.getElementById('stat-new').textContent = leads.filter(function (l) { return l.status === 'new' }).length
        document.getElementById('stat-contacted').textContent = leads.filter(function (l) { return l.status === 'contacted' }).length
        document.getElementById('stat-converted').textContent = leads.filter(function (l) { return l.status === 'converted' }).length
      }

      function loadLeads() {
        loadingState.style.display = 'block'
        errorState.style.display = 'none'
        tableWrap.style.display = 'none'
        emptyState.style.display = 'none'

        supabase.from('marketing_leads')
          .select('*')
          .order('created_at', { ascending: false })
          .then(function (res) {
            loadingState.style.display = 'none'
            if (res.error) {
              errorState.textContent = 'Failed to load leads: ' + res.error.message
              errorState.style.display = 'block'
              return
            }
            renderLeads(res.data || [])
          })
      }

      function updateLeadStatus(leadId, newStatus) {
        supabase.rpc('update_lead_status', { p_lead_id: leadId, p_status: newStatus })
          .then(function (res) {
            if (res.error) {
              loadLeads()
            } else {
              allLeads = allLeads.map(function (l) {
                if (l.id === leadId) l.status = newStatus
                return l
              })
              renderLeads(allLeads)
            }
          })
      }

      function exportCsv(leads) {
        var filtered = filterLeads(leads)
        if (filtered.length === 0) return
        var rows = [['Date', 'Lodge Name', 'Contact Name', 'Email', 'Phone', 'Interest', 'Notes', 'Status', 'Source']]
        filtered.forEach(function (l) {
          rows.push([
            l.created_at || '',
            l.lodge_name || '',
            l.contact_name || '',
            l.email || '',
            l.phone || '',
            l.interest || '',
            (l.notes || '').replace(/"/g, '""'),
            l.status || '',
            l.source || ''
          ])
        })
        var csv = rows.map(function (r) { return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"' }).join(',') }).join('\n')
        var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' })
        var link = document.createElement('a')
        link.href = URL.createObjectURL(blob)
        link.download = 'boroko-leads-' + new Date().toISOString().slice(0, 10) + '.csv'
        link.click()
      }

      function checkSession() {
        initSupabase()
        supabase.auth.getSession().then(function (res) {
          if (res.data && res.data.session) {
            currentUser = res.data.session.user
            showView('dashboard')
            userEmail.textContent = currentUser.email
            loadLeads()
          } else {
            showView('login')
          }
        })
      }

      loginForm.addEventListener('submit', function (e) {
        e.preventDefault()
        loginError.style.display = 'none'
        var email = loginEmail.value.trim()
        var password = loginPassword.value
        if (!email || !password) return
        var btn = loginForm.querySelector('button[type="submit"]')
        btn.disabled = true
        btn.textContent = 'Signing in...'

        function trySignIn() {
          supabase.auth.signInWithPassword({ email: email, password: password }).then(function (res) {
            btn.disabled = false
            btn.textContent = 'Sign in'
            if (res.error) {
              loginError.textContent = res.error.message
              loginError.style.display = 'block'
            } else {
              checkSession()
            }
          }).catch(function (err) {
            btn.disabled = false
            btn.textContent = 'Sign in'
            loginError.textContent = err.message || 'Authentication failed'
            loginError.style.display = 'block'
          })
        }

        fetch(EDGE_FUNCTION_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
          body: JSON.stringify({ email: email, password: password })
        }).then(function (r) { return r.json() }).then(function (data) {
          if (data.success) {
            trySignIn()
          } else {
            trySignIn()
          }
        }).catch(function () {
          trySignIn()
        })
      })

      logoutBtn.addEventListener('click', function () {
        supabase.auth.signOut().then(function () {
          currentUser = null
          showView('login')
        })
      })

      statusFilter.addEventListener('change', function () {
        renderLeads(allLeads)
      })

      searchInput.addEventListener('input', function () {
        renderLeads(allLeads)
      })

      exportBtn.addEventListener('click', function () {
        exportCsv(allLeads)
      })

      if (togglePasswordBtn && loginPasswordInput) {
        togglePasswordBtn.addEventListener('click', function () {
          var isHidden = loginPasswordInput.type === 'password'
          loginPasswordInput.type = isHidden ? 'text' : 'password'
          togglePasswordBtn.textContent = isHidden ? '🙈' : '👁'
          togglePasswordBtn.title = isHidden ? 'Hide password' : 'Show password'
        })
      }

      checkSession()
    })()
    </script>
  </body>
</html>
